name: Release Analytics

# Stages packages/analytics on npm via trusted publishing (OIDC), no token.
# A maintainer approves the staged version on npmjs.com (2FA) before it goes live.
# Trigger: push a tag like analytics-v0.0.4 whose version matches packages/analytics/package.json.

on:
  push:
    tags:
      - "analytics-v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/analytics
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      # Trusted publishing needs npm >= 11.5.1; pinned to an exact version so the release does not change underneath us.
      - run: npm install -g npm@11.21.1
      - name: npm must be the pinned version
        run: test "$(npm -v)" = "11.21.1" || { echo "npm $(npm -v) is not the pinned 11.21.1"; exit 1; }
      - name: Tag must match package version
        run: node ../../scripts/check-release-tag.mjs packages/analytics
      - run: npm ci
      # Explicit steps: we do not rely on npm stage publish running prepublishOnly.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm stage publish .
