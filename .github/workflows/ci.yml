name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: node --test scripts/*.test.mjs
      # Rules live in a repository secret so the list itself stays private; output is redacted.
      # Secrets are not passed to pull requests from forks, so those are checked after merge on main.
      - if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: node scripts/boundary-check.mjs --all --redact
        env:
          BOUNDARY_TERMS: ${{ secrets.BOUNDARY_TERMS }}

  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  analytics:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/analytics
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The peer range starts at hono 4.8.0, the first version with hono/route; test against that floor too.
      - name: Test against the minimum hono version
        run: npm i --no-save hono@4.8.0 && npm test

  demo-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/demo-api
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: node --test scripts/*.test.mjs
      # check-vendor packs packages/analytics afresh and compares it with vendor/, file by file.
      - run: npm ci
        working-directory: packages/analytics
      - run: node scripts/check-vendor.mjs
      - run: npm ci
      - run: npm run typecheck
      # Bundles the Worker without deploying or logging in, so a dependency update that breaks the build fails here.
      - run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/demo-api"
        env:
          WRANGLER_SEND_METRICS: "false"
