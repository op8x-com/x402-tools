name: Release CLI

# Stages packages/cli on npm via trusted publishing (OIDC), no token.
# A maintainer approves the staged version on npmjs.com (2FA) before it goes live.
# Trigger: push a tag like cli-v0.0.2 whose version matches packages/cli/package.json.

on:
  push:
    tags:
      - "cli-v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest
      - name: Tag must match package version
        run: |
          expected="cli-v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version ($expected)"
            exit 1
          fi
      - run: npm ci
      # prepublishOnly runs typecheck, tests and build.
      - run: npm stage publish .
